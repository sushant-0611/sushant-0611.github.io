<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SushTech | Projects & Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== THEME (matches style.css) ===== */
        :root {
            --primary: #2563EB;
            --accent: #3B82F6;
            --dark-bg: #030712;
            --card-bg: #111827;
            --text-primary: #F9FAFB;
            --text-muted: #9CA3AF;
            --border-color: #1F2937;
            --glow-color: rgba(37,99,235,0.5);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            padding-top: 80px;
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* header (reused) */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(3,7,18,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            height: 80px;
            z-index: 1000;
        }
        .logo img { height: 50px; width: auto; }
        .menu-icon {
            font-size: 32px;
            cursor: pointer;
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .menu-icon:hover { color: var(--accent); }

        /* side panel */
        .side-panel {
            position: fixed;
            top: 0; right: -350px;
            width: 320px;
            height: 100vh;
            background: var(--card-bg);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            transition: right 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 40px rgba(0,0,0,0.7);
            overflow-y: auto;
        }
        .side-panel.active { right: 0; }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            border-bottom: 2px solid var(--border-color);
        }
        .panel-logo img { height: 35px; }
        .close-icon {
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
            padding: 0 10px;
        }
        .close-icon:hover { color: var(--accent); transform: rotate(90deg); }
        .panel-nav {
            flex: 1;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-link {
            font-size: 1.2rem;
            font-weight: 500;
            padding: 14px 20px;
            border-radius: 12px;
            border-left: 4px solid transparent;
            transition: 0.3s;
            color: var(--text-primary);
            background: rgba(255,255,255,0.02);
        }
        .panel-link:hover { border-left-color: var(--accent); color: var(--accent); background: rgba(37,99,235,0.15); }
        .panel-footer {
            padding: 25px 20px;
            border-top: 2px solid var(--border-color);
            color: var(--text-muted);
            text-align: center;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: none;
        }
        .overlay.active { display: block; }

        /* page title */
        .page-title {
            text-align: center;
            padding: 40px 0 20px;
        }
        .page-title h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
        }
        .page-title h1 span { color: var(--accent); }
        .page-title p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 10px auto 0;
        }

        /* project grid */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 30px 0 60px;
        }
        .project-card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: 0.4s;
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 30px -10px rgba(59,130,246,0.2);
        }
        .project-image {
            height: 200px;
            overflow: hidden;
            background: #1a2538;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--accent);
        }
        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }
        .project-card:hover .project-image img { transform: scale(1.05); }
        .project-info {
            padding: 24px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .project-category {
            display: inline-block;
            background: rgba(59,130,246,0.15);
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            align-self: flex-start;
        }
        .project-info h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .project-info p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .project-tags span {
            background: rgba(255,255,255,0.06);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .project-btn {
            padding: 10px 20px;
            border-radius: 40px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            align-self: flex-start;
        }
        .project-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37,99,235,0.3);
        }
        .project-btn.secondary {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            margin-left: 10px;
        }
        .project-btn.secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .project-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

        /* footer */
        .footer-bar {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 20px;
        }

        /* responsive */
        @media (max-width: 768px) {
            header { padding: 12px 4%; }
            .project-grid { grid-template-columns: 1fr; }
            .project-image { height: 180px; }
        }
        @media (max-width: 480px) {
            .project-image { height: 160px; }
        }
    </style>
</head>
<body><!-- Loader: Shows until page is fully loaded -->
    <div id="loader-wrapper">
        <div class="loader"></div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="SushTech_logo_transparent1.webp" loading="eager" fetchpriority="high" alt="SushTech Logo" width="50" height="50">
        </div>

        <div class="menu-icon" id="menuToggle">☰</div>

        <!-- Right Side Panel Menu - Reordered to match new sequence -->
        <div class="side-panel" id="sidePanel">
            <div class="panel-header">
                <div class="panel-logo">
                    <img src="SushTech_logo_transparent1.webp" loading="lazy" alt="Logo">
                </div>
                <div class="close-icon" id="closePanel">✕</div>
            </div>
            <nav class="panel-nav">
                <a href="#home" class="panel-link">Home</a>
                <a href="#why-choose" class="panel-link">Why Us</a>
                <a href="#features" class="panel-link">Features</a>
                <a href="projects.html" class="panel-link">Projects</a>
                <a href="#demo" class="panel-link">Demo Websites</a>
                <a href="#about" class="panel-link">About</a>
                <a href="#contact" class="panel-link">Contact</a>
            </nav>
            <div class="panel-footer">
                <p>© 2026 SushTech</p>
            </div>
        </div>
    </header>

    <!-- Overlay for when panel is open -->
    <div class="overlay" id="overlay"></div>


    <!-- ===== PROJECTS PAGE CONTENT ===== -->
    <section class="container">
        <div class="page-title">
            <h1>Our <span>Projects</span></h1>
            <p>Explore a selection of websites we've built for clients across industries.</p>
        </div>

        <div class="project-grid">
            
            </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer-bar">
        <div class="container">
            <p>© 2026 SushTech. All rights reserved. | <a href="project.html" style="color:var(--accent);">SushTech Innovation</a></p>
        </div>
    </footer>

    <!-- ===== SCRIPTS (panel toggle) ===== -->
    <script>
        (function() {
            const menuToggle = document.getElementById('menuToggle');
            const sidePanel = document.getElementById('sidePanel');
            const closePanel = document.getElementById('closePanel');
            const overlay = document.getElementById('overlay');

            function openPanel() {
                sidePanel.classList.add('active');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            function closePanelFn() {
                sidePanel.classList.remove('active');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            if (menuToggle) menuToggle.addEventListener('click', openPanel);
            if (closePanel) closePanel.addEventListener('click', closePanelFn);
            if (overlay) overlay.addEventListener('click', closePanelFn);
        })();
    </script>

</body>
</html>
